services:
  web:
    build:
      target: base
    # Instalamos debugpy al vuelo y levantamos Uvicorn (HTTP y WebSockets de la bandeja) en lugar de gunicorn
    command: >
      sh -c "pip install debugpy && 
             python -m debugpy --listen 0.0.0.0:5678 -m uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    volumes:
      # Sync local code with the container in real time (hot reload)
      - .:/app
    ports:
      # Exponemos el puerto de debugpy para conectar VS Code
      - "5678:5678"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEBUG=True

  celery-worker:
    build:
      target: base
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEBUG=True

  celery-beat:
    build:
      target: base
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.local
      - DEBUG=True
