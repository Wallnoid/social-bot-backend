[project]
name = "social-bot-backend"
version = "1.0.0"
description = "Backend for the Social Bot suite: WhatsApp, Messenger and Instagram inbox, calendar, CRM and notifications"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"

dependencies = [
    # Django
    "django>=5.2,<6.0",
    "django-environ>=0.12",

    # Django REST Framework
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.3",
    "django-filter>=24.0",
    "django-cors-headers>=4.4",

    # API Documentation
    "drf-spectacular>=0.28",

    # Database
    "psycopg[binary]>=3.2",

    # Caching & Async Tasks
    "redis>=5.0",
    "celery>=5.4",
    "django-celery-beat>=2.7",

    # Health Checks
    "django-health-check>=3.18",

    # Image handling
    "Pillow>=10.0",

    # Production server
    "gunicorn>=22.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.0",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "factory-boy>=3.3",

    # Code Quality
    "ruff>=0.7",
    "mypy>=1.11",
    "django-stubs>=5.0",
    "djangorestframework-stubs>=3.15",

    # Development tools
    "ipython>=8.0",
    "django-extensions>=3.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "DJ",   # flake8-django
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.mypy]
python_version = "3.12"
plugins = [
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.setuptools.packages.find]
include = ["apps*", "config*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
